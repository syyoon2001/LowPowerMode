<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Low Power Mood</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAFBFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Low Power Mood">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ═══════════════════════════════════════════════════
   토큰 — 색과 리듬은 전부 여기서 나옵니다
   ═══════════════════════════════════════════════════ */
:root{
  --mint:#70C4B8; --mint-soft:#98D2CA; --sky:#B8E6EE; --pale:#D2EAF3;
  --green:#BFE1B0; --yellow:#F4E89C; --lav:#BBC7E8; --pink:#F9DCEF;

  --bg:#FAFBFB; --card:#FFFFFF; --line:#E9EEEE; --muted:#D8DDDC;
  --body:#555958; --head:#181C1B;
  --dim:#8E9594;

  --r-card:18px; --r-sheet:26px;
  --gap:9px;
  --pad:18px;
  --chrome:52px;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  --ease:cubic-bezier(.32,.72,0,1);
  --ease-soft:cubic-bezier(.25,.8,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--body);
  font:400 15px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;width:100%;font-size:16px;
  transition:border-color .16s ease-out,box-shadow .16s ease-out;
}
input:focus,select:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px rgba(112,196,184,.16)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:8px}

/* ═══════════ 뼈대 ═══════════ */
.app{max-width:520px;margin:0 auto;height:100dvh;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* 반투명 크롬 — 내용이 아래로 흘러 지나갑니다 */
.chrome{
  position:absolute;top:0;left:0;right:0;z-index:20;
  height:calc(var(--safe-t) + var(--chrome));
  padding:var(--safe-t) 10px 0 var(--pad);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(250,251,251,0);
  -webkit-backdrop-filter:blur(0px) saturate(180%);backdrop-filter:blur(0px) saturate(180%);
  transition:background .28s var(--ease-soft), backdrop-filter .28s var(--ease-soft);
}
.chrome.lift{
  background:rgba(250,251,251,.72);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
}
/* 딱딱한 1px 선 대신, 내용과 크롬이 만나는 곳만 부드럽게 흐려집니다 */
.chrome::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:16px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(250,251,251,.72),rgba(250,251,251,0));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent);
  mask-image:linear-gradient(to bottom,#000,transparent);
  opacity:0;transition:opacity .28s var(--ease-soft);
}
.chrome.lift::after{opacity:1}
.brand{font-size:13px;font-weight:600;letter-spacing:.015em;color:var(--dim);white-space:nowrap;user-select:none}
.ctitle{font-size:16px;font-weight:650;letter-spacing:-.01em;color:var(--head)}
.tools{display:flex;align-items:center;gap:2px;margin-left:auto}

.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--body);transition:transform .1s ease-out,background .16s ease-out;
}
.iconbtn:active{background:rgba(24,28,27,.055);transform:scale(.92)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

.scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--safe-t) + var(--chrome)) var(--pad) calc(var(--safe-b) + 52px);
}

.head{padding:14px 2px 20px}
.day{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.032em;color:var(--head)}
.sub{margin-top:5px;font-size:13.5px;font-weight:500;letter-spacing:.005em;color:var(--dim)}

/* ═══════════ 블록 ═══════════ */
.blocks{display:flex;flex-direction:column;gap:var(--gap);position:relative}
.block{
  position:relative;background:var(--card);border-radius:var(--r-card);
  box-shadow:0 0 0 1px rgba(24,28,27,.045), 0 1px 2px rgba(24,28,27,.03);
  padding:14px 12px 14px 12px;display:flex;align-items:center;gap:10px;
  will-change:transform;
  transition:background .3s var(--ease-soft), box-shadow .22s var(--ease-soft);
}
.block.press{background:#F6F8F8}
.block.done{background:#F0F3F3;box-shadow:0 0 0 1px rgba(24,28,27,.03)}
.block.lifted{
  box-shadow:0 0 0 1px rgba(112,196,184,.35), 0 14px 34px rgba(24,28,27,.14);
  background:var(--card);z-index:3;
}
.block.settling{transition:transform .34s var(--ease), background .3s var(--ease-soft), box-shadow .22s var(--ease-soft)}

/* 왼쪽 손잡이 — 길게 누르면 잡힙니다 */
.handle{
  flex:0 0 auto;width:24px;height:26px;display:grid;place-items:center;color:#D3D9D8;
  transition:color .2s var(--ease-soft),transform .2s var(--ease-soft);
}
.handle svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lifted .handle{color:var(--mint);transform:scale(1.12)}
.done .handle{color:#E2E7E6}

.b-main{flex:1;min-width:0}
.b-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:13.5px;font-weight:650;letter-spacing:-.003em;
  padding:5px 11px;border-radius:10px;color:#333938;
  transition:opacity .3s var(--ease-soft);
}
.done .chip{opacity:.38}
.b-none{font-size:14.5px;font-weight:500;letter-spacing:-.005em;color:var(--muted)}
.done .b-none{opacity:.6}

.b-side{flex:0 0 auto;display:flex;align-items:center;gap:1px}
.b-min{
  font-size:12.5px;font-weight:650;color:var(--muted);padding:0 5px;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;transition:color .2s ease-out;
}
.b-min.run{color:var(--mint)}
.smallbtn{
  width:31px;height:31px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
  transition:transform .1s ease-out,background .16s ease-out,color .16s ease-out;
}
.smallbtn:active{background:rgba(24,28,27,.055);transform:scale(.9)}
.smallbtn.play{color:var(--mint)}
.smallbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}

.empty{text-align:center;padding:52px 24px;color:var(--muted);font-size:14.5px;line-height:1.75;letter-spacing:.005em}

.addbtn{
  width:100%;margin-top:var(--gap);padding:15px;border-radius:var(--r-card);
  color:var(--muted);font-weight:600;font-size:15px;letter-spacing:.005em;
  box-shadow:inset 0 0 0 1.5px var(--line);
  transition:transform .1s ease-out,color .16s,box-shadow .16s,background .16s;
}
.addbtn:active{transform:scale(.985);background:#F4F7F7;color:var(--dim)}

/* ═══════════ 시트 ═══════════ */
.veil{position:fixed;inset:0;z-index:70;background:rgba(24,28,27,.34);opacity:0;pointer-events:none}
.veil.on{pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:80;width:100%;max-width:520px;
  transform:translate(-50%,100%);
  background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:0 var(--pad) calc(var(--safe-b) + 22px);
  max-height:88dvh;overflow-y:auto;
  box-shadow:0 -12px 40px rgba(24,28,27,.14);
  will-change:transform;visibility:hidden;
}
.sheet.on{visibility:visible}
.grabzone{padding:10px 0 4px;margin:0 calc(var(--pad) * -1);touch-action:none;cursor:grab}
.grab{width:38px;height:5px;border-radius:3px;background:#DFE5E4;margin:0 auto}
.sheet h3{margin:12px 0 18px;font-size:19px;font-weight:700;letter-spacing:-.022em;color:var(--head)}
.field{margin-bottom:17px}
.field>label{display:block;margin-bottom:8px;font-size:12.5px;font-weight:650;letter-spacing:.015em;color:var(--dim)}
.opt{
  display:block;width:100%;text-align:left;padding:16px;margin-bottom:8px;border-radius:15px;
  background:var(--bg);font-size:15.5px;font-weight:600;letter-spacing:-.008em;color:var(--head);
  transition:transform .1s ease-out,background .16s;
}
.opt:active{transform:scale(.985);background:#F1F4F4}
.opt small{display:block;margin-top:3px;font-size:12.5px;font-weight:500;letter-spacing:.005em;color:var(--dim)}
.grp{margin:20px 0 9px;font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--muted)}

.actions{display:flex;gap:9px;margin-top:22px}
.btn{
  flex:1;padding:15px;border-radius:15px;text-align:center;
  font-size:15.5px;font-weight:650;letter-spacing:-.008em;
  transition:transform .1s ease-out,opacity .16s;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--mint);color:#fff;box-shadow:0 3px 12px rgba(112,196,184,.34)}
.btn.danger{flex:0 0 auto;padding:15px 20px;background:var(--bg);color:#C98686}

.picker{border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.picker .row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;box-shadow:inset 0 -1px 0 var(--line);transition:background .14s;
}
.picker .row:last-child{box-shadow:none}
.picker .row:active{background:var(--bg)}
.picker .box{
  flex:0 0 auto;width:20px;height:20px;border-radius:7px;border:1.8px solid var(--muted);
  display:grid;place-items:center;transition:background .2s var(--ease-soft),border-color .2s var(--ease-soft);
}
.picker .row.sel .box{background:var(--mint);border-color:var(--mint)}
.picker .box svg{
  width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
  transform:scale(.4);opacity:0;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .14s;
}
.picker .row.sel .box svg{transform:scale(1);opacity:1}
.picker .nm{font-size:15px;font-weight:600;letter-spacing:-.005em;color:var(--head)}
.picker .none{padding:18px;text-align:center;font-size:14px;color:var(--muted);line-height:1.7}

/* 색 고르기 */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.swatch{
  aspect-ratio:1;border-radius:16px;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(24,28,27,.05);
  transition:transform .12s ease-out;
}
.swatch:active{transform:scale(.9)}
.swatch svg{
  width:20px;height:20px;stroke:#2E3534;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round;
  transform:scale(.4);opacity:0;transition:transform .32s cubic-bezier(.3,1.5,.5,1),opacity .14s;
}
.swatch.sel svg{transform:scale(1);opacity:1}

/* ═══════════ 설정 ═══════════ */
.sec{margin-top:26px}
.sec h4{margin:0 0 10px;padding:0 4px;font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--muted)}
.sec h4 em{display:block;margin-top:5px;font-style:normal;font-size:12.5px;font-weight:500;letter-spacing:.005em;line-height:1.5}
.card{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:0 0 0 1px rgba(24,28,27,.045)}
.line{display:flex;align-items:center;gap:12px;padding:15px;box-shadow:inset 0 -1px 0 var(--line)}
.line:last-child{box-shadow:none}
.line .t{flex:1;font-size:15px;font-weight:600;letter-spacing:-.005em;color:var(--head)}
.line .t small{display:block;margin-top:2px;font-size:12.5px;font-weight:500;letter-spacing:.005em;color:var(--dim)}
.line .t.pale{color:var(--muted);font-weight:500}
.line select,.line input[type=number]{width:auto;min-width:92px;text-align:center;padding:9px 11px;font-size:15px}
.line input[type=text]{flex:1;border:0;background:transparent;padding:0;box-shadow:none;
  font-size:15px;font-weight:600;letter-spacing:-.005em;color:var(--head)}
.line input[type=text]:focus{box-shadow:none}
.dotcolor{
  flex:0 0 auto;width:26px;height:26px;border-radius:9px;
  box-shadow:inset 0 0 0 1px rgba(24,28,27,.06);
  transition:transform .11s ease-out;
}
.dotcolor:active{transform:scale(.88)}

.toggle{flex:0 0 auto;width:50px;height:30px;border-radius:16px;background:var(--muted);position:relative;
  transition:background .28s var(--ease-soft)}
.toggle.on{background:var(--mint)}
.toggle i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(24,28,27,.2);transition:transform .34s var(--ease)}
.toggle.on i{transform:translateX(20px)}

.seg{display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--bg)}
.seg button{padding:8px 14px;border-radius:9px;font-size:14px;font-weight:650;color:var(--dim);
  transition:background .2s var(--ease-soft),color .2s}
.seg button.on{background:var(--card);color:var(--head);box-shadow:0 1px 3px rgba(24,28,27,.09)}
.addline{width:100%;text-align:left;padding:15px;font-size:15px;font-weight:650;color:var(--mint);transition:background .16s}
.addline:active{background:var(--bg)}

/* ═══════════ 달력 ═══════════ */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.calhead .m{font-size:19px;font-weight:700;letter-spacing:-.022em;color:var(--head)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.wd span{text-align:center;font-size:11.5px;font-weight:650;letter-spacing:.03em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{
  aspect-ratio:1/1.08;border-radius:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;
  font-size:14.5px;font-weight:600;letter-spacing:-.005em;color:var(--head);
  transition:transform .1s ease-out,background .16s;
}
.cell:active{transform:scale(.9);background:var(--line)}
.cell.pad{visibility:hidden;pointer-events:none}
.cell.today{background:var(--pale)}
.cell .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.cell.has .dot{background:var(--mint)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 40px);z-index:90;
  padding:13px 22px;border-radius:24px;
  background:rgba(24,28,27,.9);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:#fff;font-size:14.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  transition:opacity .26s var(--ease-soft),transform .34s var(--ease);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.12s!important}
}
@media (prefers-reduced-transparency:reduce){
  .chrome.lift{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 0 var(--line)}
  .chrome::after{display:none}
}
@media (prefers-contrast:more){
  .block,.card{box-shadow:0 0 0 1.5px var(--body)}
}
</style>
</head>
<body>

<div class="app">

  <!-- ══════ 오늘 ══════ -->
  <section class="view on" id="v-home">
    <header class="chrome">
      <div class="brand">Low Power Mood</div>
      <div class="tools">
        <button class="iconbtn" id="go-settings" aria-label="설정">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="iconbtn" id="go-cal" aria-label="달력">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </button>
      </div>
    </header>
    <div class="scroll">
      <div class="head">
        <div class="day" id="h-date"></div>
        <div class="sub" id="h-sub"></div>
      </div>
      <div class="blocks" id="h-blocks"></div>
      <button class="addbtn" id="h-add">+ 추가</button>
    </div>
  </section>

  <!-- ══════ 달력 ══════ -->
  <section class="view" id="v-cal">
    <header class="chrome">
      <button class="iconbtn back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 4.5l-7.5 7.5L15 19.5"/></svg></button>
      <div class="ctitle">달력</div>
      <div class="tools" style="width:38px"></div>
    </header>
    <div class="scroll">
      <div style="height:14px"></div>
      <div class="calhead">
        <button class="iconbtn" id="c-prev" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 4.5l-7.5 7.5L15 19.5"/></svg></button>
        <div class="m" id="c-month"></div>
        <button class="iconbtn" id="c-next" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 4.5l7.5 7.5L9 19.5"/></svg></button>
      </div>
      <div class="wd" id="c-wd"></div>
      <div class="grid" id="c-grid"></div>
    </div>
  </section>

  <!-- ══════ 특정 날짜 ══════ -->
  <section class="view" id="v-day">
    <header class="chrome">
      <button class="iconbtn back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 4.5l-7.5 7.5L15 19.5"/></svg></button>
    </header>
    <div class="scroll">
      <div class="head"><div class="day" id="d-date"></div></div>
      <div class="blocks" id="d-blocks"></div>
      <button class="addbtn" id="d-add">+ 추가</button>
    </div>
  </section>

  <!-- ══════ 설정 ══════ -->
  <section class="view" id="v-set">
    <header class="chrome">
      <button class="iconbtn back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 4.5l-7.5 7.5L15 19.5"/></svg></button>
      <div class="ctitle">설정</div>
      <div class="tools" style="width:38px"></div>
    </header>
    <div class="scroll" id="s-body"></div>
  </section>

  <!-- ══════ 모드 편집 ══════ -->
  <section class="view" id="v-mode">
    <header class="chrome">
      <button class="iconbtn back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 4.5l-7.5 7.5L15 19.5"/></svg></button>
      <div class="tools">
        <button class="iconbtn" id="m-del" aria-label="모드 삭제">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l.9 12.5h9.2L17.5 7"/></svg>
        </button>
      </div>
    </header>
    <div class="scroll">
      <div style="height:16px"></div>
      <div class="field"><label>모드 이름</label><input type="text" id="m-name" placeholder="예: 느린 날"></div>
      <div class="blocks" id="m-blocks"></div>
      <button class="addbtn" id="m-add">+ 블록 추가</button>
    </div>
  </section>
</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════
   1. 스프링 — 이 앱의 모든 움직임은 여기서 나옵니다.
      값이 아니라 '행동'을 정의하기 때문에 언제든
      중간에 붙잡아 방향을 바꿀 수 있습니다.
      eps: 멈춤 판정 기준. px 단위는 0.08, 0~1 값은 0.0015
   ═══════════════════════════════════════════════════ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');

function spring({from=0, response=.4, damping=1, eps=.08, onUpdate, onRest}){
  const w = 2*Math.PI/response;
  let x=from, v=0, target=from, raf=null, last=0;

  function frame(t){
    if(!last) last=t;
    let dt=Math.min((t-last)/1000, 1/30); last=t;
    const steps=Math.max(1,Math.ceil(dt/0.004)), h=dt/steps;
    for(let i=0;i<steps;i++){
      const a = -w*w*(x-target) - 2*damping*w*v;
      v += a*h; x += v*h;
    }
    onUpdate(x,v);
    if(Math.abs(x-target)<eps && Math.abs(v)<eps*20){
      x=target; v=0; onUpdate(x,0); raf=null; last=0; onRest&&onRest(); return;
    }
    raf=requestAnimationFrame(frame);
  }
  return {
    to(t, vel){
      target=t;
      if(vel!=null) v=vel;
      if(REDUCED.matches){ x=target; v=0; onUpdate(x,0); onRest&&onRest(); return; }
      if(!raf){ last=0; raf=requestAnimationFrame(frame); }
    },
    set(p, vel=0){ if(raf)cancelAnimationFrame(raf); raf=null; last=0; x=p; v=vel; target=p; onUpdate(x,v); },
    stop(){ if(raf)cancelAnimationFrame(raf); raf=null; last=0; },
    get x(){return x}, get v(){return v}
  };
}
/* 손을 뗀 속도로 멈출 지점을 예측합니다 (스크롤 감속과 같은 방식) */
const project=(v,d=.998)=> (v/1000)*d/(1-d);
/* 경계 밖에서는 딱 멈추지 않고 점점 무거워집니다 */
const rubber=(over,dim,c=.55)=> (over*dim*c)/(dim+c*Math.abs(over));
const haptic=p=>{ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ═══════════════════════════════════════════════════
   2. 저장소
   ═══════════════════════════════════════════════════ */
const KEY='oneday.v1';
let memFallback=null;

/* 할 일 색 팔레트 */
const PALETTE=[
  {n:'민트',   c:'#70C4B8'},
  {n:'연민트', c:'#98D2CA'},
  {n:'하늘',   c:'#B8E6EE'},
  {n:'연하늘', c:'#D2EAF3'},
  {n:'연두',   c:'#BFE1B0'},
  {n:'노랑',   c:'#F4E89C'},
  {n:'라벤더', c:'#BBC7E8'},
  {n:'분홍',   c:'#F9DCEF'}
];

const DEFAULT={
  settings:{ resetHour:0, weekStart:'mon', defaultMinutes:25, timer:false },
  tasks:[],
  dailyBlocks:[],
  modes:[],
  days:{}
};

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const saved=JSON.parse(raw);
      const merged=Object.assign(structuredClone(DEFAULT),saved);
      merged.settings=Object.assign({},DEFAULT.settings,saved.settings||{});
      /* 예전 기록에 색이 없으면 채워줍니다 */
      (merged.tasks||[]).forEach((t,i)=>{ if(!t.color) t.color=PALETTE[i%PALETTE.length].c; });
      return merged;
    }
  }catch(e){}
  return memFallback||structuredClone(DEFAULT);
}
let state=load();
function save(){ memFallback=state; try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

/* ═══════════════════════════════════════════════════
   3. 날짜
   ═══════════════════════════════════════════════════ */
const WD_MON=['월','화','수','목','금','토','일'];
const WD_SUN=['일','월','화','수','목','금','토'];
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function todayKey(){
  const d=new Date();
  if(d.getHours()<state.settings.resetHour) d.setDate(d.getDate()-1);
  return ymd(d);
}
function label(key){
  const [y,m,dd]=key.split('-').map(Number);
  return `${m}월 ${dd}일 ${WD_SUN[new Date(y,m-1,dd).getDay()]}요일`;
}
function ensureToday(){
  const k=todayKey();
  if(!state.days[k]){
    state.days[k]={blocks:state.dailyBlocks.map(b=>({
      id:uid(),minutes:b.minutes,taskIds:[...(b.taskIds||[])],done:false
    }))};
    save();
  }
  return k;
}
let curKey=ensureToday();

/* ═══════════════════════════════════════════════════
   4. 화면 이동
   ═══════════════════════════════════════════════════ */
function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));
  const sc=document.querySelector('.view.on .scroll');
  if(sc) sc.scrollTop=0;
  syncChrome();
}
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{
  const cur=document.querySelector('.view.on').id;
  if(cur==='v-mode'){ saveModeEdit(); renderSettings(); show('v-set'); }
  else if(cur==='v-day'){ renderCal(); show('v-cal'); }
  else { renderHome(); show('v-home'); }
});
$('#go-settings').onclick=()=>{ renderSettings(); show('v-set'); };
$('#go-cal').onclick=()=>{ renderCal(); show('v-cal'); };

function syncChrome(){
  document.querySelectorAll('.view').forEach(v=>{
    const sc=v.querySelector('.scroll'), ch=v.querySelector('.chrome');
    if(!sc||!ch) return;
    ch.classList.toggle('lift', sc.scrollTop>6);
  });
}
document.querySelectorAll('.scroll').forEach(sc=>sc.addEventListener('scroll',syncChrome,{passive:true}));

/* ═══════════════════════════════════════════════════
   5. 블록 그리기 — 블록의 이름은 곧 담긴 할 일입니다
   ═══════════════════════════════════════════════════ */
const task=id=>state.tasks.find(t=>t.id===id);
const taskColor=id=>{ const t=task(id); return t&&t.color?t.color:'#E9EEEE'; };
const taskName=id=>{ const t=task(id); return t?t.name:null; };

const CHECK ='<svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg>';
const EDIT  ='<svg viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>';
const PLAY  ='<svg viewBox="0 0 24 24"><path d="M7.5 4.5l12 7.5-12 7.5z" fill="currentColor" stroke="none"/></svg>';
const PAUSE ='<svg viewBox="0 0 24 24"><path d="M8.5 4.5v15M15.5 4.5v15"/></svg>';
const HANDLE='<svg viewBox="0 0 24 24"><path d="M12 4.5L12 19.5M12 4.5L8 8.5M12 4.5l4 4M12 19.5l-4-4M12 19.5l4-4"/></svg>';
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

/* 설정 목록 등에서 블록을 한 줄로 부를 때 쓰는 이름 */
function blockLabel(b){
  const names=(b.taskIds||[]).map(taskName).filter(Boolean);
  return names.length?names.join(' · '):null;
}

function renderBlocks(el, list, opts, onChange){
  el.innerHTML='';
  if(!list.length){
    el.innerHTML=`<div class="empty">${opts.emptyText||emptyHint()}</div>`;
    return;
  }
  list.forEach((b,idx)=>{
    const d=document.createElement('div');
    d.className='block'+(b.done?' done':'');
    d.dataset.id=b.id;
    const chips=(b.taskIds||[]).map(id=>{
      const n=taskName(id); if(!n) return '';
      return `<span class="chip" style="background:${taskColor(id)}">${esc(n)}</span>`;
    }).join('');
    const running = timer.id===b.id;
    d.innerHTML=`
      <div class="handle" aria-hidden="true">${HANDLE}</div>
      <div class="b-main">
        ${chips?`<div class="b-chips">${chips}</div>`:`<div class="b-none">할 일 없음</div>`}
      </div>
      <div class="b-side">
        <span class="b-min${running?' run':''}">${running?fmt(timer.left):b.minutes+'분'}</span>
        ${opts.timer?`<button class="smallbtn play" data-a="timer" aria-label="타이머">${running&&timer.on?PAUSE:PLAY}</button>`:''}
        <button class="smallbtn" data-a="edit" aria-label="편집">${EDIT}</button>
      </div>`;

    d.querySelector('[data-a="edit"]').addEventListener('click',e=>{
      e.stopPropagation(); openBlockEditor(list,idx,onChange);
    });
    const tb=d.querySelector('[data-a="timer"]');
    if(tb) tb.addEventListener('click',e=>{ e.stopPropagation(); toggleTimer(b); });

    el.appendChild(d);
  });
  attachGestures(el,list,opts,onChange);
}
function emptyHint(){
  return state.tasks.length
    ? '아직 블록이 없어요.<br>아래 + 로 하나만 만들어볼까요.'
    : '설정에서 할 일을 먼저 몇 개 만들어주세요.<br>블록은 그 할 일들로 채워집니다.';
}

/* ═══════════════════════════════════════════════════
   6. 제스처 — 누르는 즉시 반응하고, 길게 누르면
      손가락에 1:1로 붙어 따라옵니다.
   ═══════════════════════════════════════════════════ */
const HOLD=380, SLOP=9;

function attachGestures(container, list, opts, onChange){
  container.querySelectorAll('.block').forEach(card=>{
    let holdTimer=null, startY=0, startX=0, grabbed=false, moved=false;
    let items=[], order=[], sp=null, hist=[];

    const layout=()=>{
      const gap=parseFloat(getComputedStyle(container).gap)||9;
      let y=items[0].top; const pos={};
      order.forEach(id=>{ pos[id]=y; y+=items.find(i=>i.id===id).h+gap; });
      return pos;
    };
    const applyLayout=()=>{
      const pos=layout();
      items.forEach(it=>{
        if(it.id===card.dataset.id) return;
        it.el.classList.add('settling');
        it.el.style.transform=`translate3d(0,${pos[it.id]-it.top}px,0)`;
      });
    };

    const start=(x,y)=>{
      startX=x; startY=y; moved=false; grabbed=false;
      card.classList.add('press');                 /* 누르는 즉시 반응 */
      holdTimer=setTimeout(()=>{
        grabbed=true;
        card.classList.remove('press');
        card.classList.add('lifted');
        haptic(11);                                 /* 시각과 같은 프레임 */
        items=[...container.querySelectorAll('.block')].map(el=>{
          const r=el.getBoundingClientRect();
          return {id:el.dataset.id, el, h:r.height, top:r.top};
        });
        order=items.map(i=>i.id);
        card.style.zIndex='3';
        sp=spring({from:0, response:.3, damping:1,
          onUpdate:v=>{ card.style.transform=`translate3d(0,${v}px,0) scale(1.025)`; }});
        sp.set(0);
      },HOLD);
    };

    const move=(x,y,e)=>{
      hist.push({y,t:performance.now()});
      if(hist.length>6) hist.shift();

      if(!grabbed){
        if(Math.abs(y-startY)>SLOP||Math.abs(x-startX)>SLOP){
          clearTimeout(holdTimer); card.classList.remove('press'); moved=true;
        }
        return;
      }
      e&&e.preventDefault();
      moved=true;

      let dy=y-startY;
      const pos=layout(), me=items.find(i=>i.id===card.dataset.id);
      const minY=items[0].top-me.top;
      const lastIt=items[items.length-1];
      const maxY=lastIt.top+lastIt.h-me.h-me.top;
      if(dy<minY) dy=minY+rubber(dy-minY,220);
      if(dy>maxY) dy=maxY+rubber(dy-maxY,220);
      card.style.transform=`translate3d(0,${dy}px,0) scale(1.025)`;
      sp.set(dy);

      /* 카드 중심이 이웃 중심을 넘어서면 자리를 바꿉니다 */
      const center=me.top+dy+me.h/2;
      const cur=order.indexOf(card.dataset.id);
      let next=cur;
      for(let i=0;i<order.length;i++){
        if(i===cur) continue;
        const it=items.find(v=>v.id===order[i]);
        const c=pos[order[i]]+it.h/2;
        if((i<cur && center<c) || (i>cur && center>c)) next = i<cur ? Math.min(next,i) : Math.max(next,i);
      }
      if(next!==cur){
        order.splice(next,0,order.splice(cur,1)[0]);
        applyLayout();
        haptic(6);
      }
    };

    const end=()=>{
      clearTimeout(holdTimer);
      card.classList.remove('press');
      if(!grabbed){
        if(!moved && opts.toggle) toggleDone(list, card.dataset.id);
        hist=[]; return;
      }
      /* 손을 뗀 속도를 그대로 이어받아 제자리로 */
      let v=0;
      if(hist.length>1){
        const a=hist[0], b=hist[hist.length-1];
        v=(b.y-a.y)/Math.max((b.t-a.t)/1000,.001);
      }
      const pos=layout(), me=items.find(i=>i.id===card.dataset.id);
      const rest=pos[card.dataset.id]-me.top;

      card.classList.remove('lifted');
      const s2=spring({from:sp.x, response:.36, damping:.82,
        onUpdate:val=>{ card.style.transform=`translate3d(0,${val}px,0) scale(1)`; },
        onRest:()=>{
          list.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
          save(); onChange();
        }});
      sp.stop(); s2.to(rest, v);
      grabbed=false; hist=[];
    };

    card.addEventListener('touchstart',e=>{
      if(e.target.closest('.smallbtn')) return;
      start(e.touches[0].clientX,e.touches[0].clientY);
    },{passive:true});
    card.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
    card.addEventListener('touchend',end);
    card.addEventListener('touchcancel',end);

    card.addEventListener('mousedown',e=>{
      if(e.target.closest('.smallbtn')) return;
      start(e.clientX,e.clientY);
      const mm=ev=>move(ev.clientX,ev.clientY,ev);
      const mu=()=>{ end(); window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
      window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
    });
  });
}

function toggleDone(list,id){
  const b=list.find(x=>x.id===id); if(!b) return;
  b.done=!b.done; save();
  const el=document.querySelector(`.block[data-id="${id}"]`);
  if(el) el.classList.toggle('done',b.done);   /* 즉시 반영, 다시 그리지 않음 */
  if(b.done) haptic(9);
}

/* ═══════════════════════════════════════════════════
   7. 타이머
   ═══════════════════════════════════════════════════ */
let timer={id:null,left:0,on:false,tick:null};
function toggleTimer(b){
  if(timer.id===b.id) timer.on=!timer.on;
  else timer={id:b.id,left:b.minutes*60,on:true,tick:null};
  clearInterval(timer.tick);
  if(timer.on){
    timer.tick=setInterval(()=>{
      timer.left--;
      if(timer.left<=0){
        clearInterval(timer.tick); timer={id:null,left:0,on:false,tick:null};
        haptic([70,50,70]); toast('시간 다 됐어. 잘했어!');
      }
      refresh();
    },1000);
  }
  refresh();
}

/* ═══════════════════════════════════════════════════
   8. 오늘
   ═══════════════════════════════════════════════════ */
function renderHome(){
  curKey=ensureToday();
  $('#h-date').textContent=label(curKey);
  const day=state.days[curKey];
  $('#h-sub').textContent = day.blocks.length ? `블록 ${day.blocks.length}개` : '';
  renderBlocks($('#h-blocks'), day.blocks, {toggle:true,timer:state.settings.timer}, renderHome);
}
$('#h-add').onclick=()=>addSheet(state.days[curKey].blocks,renderHome);

function addSheet(list,onChange){
  const modes=state.modes.map(m=>
    `<button class="opt" data-m="${m.id}">${esc(m.name)}<small>블록 ${m.blocks.length}개가 아래에 붙어요</small></button>`).join('');
  openSheet(`
    <h3>무엇을 추가할까요</h3>
    <button class="opt" data-new="1">블록 하나</button>
    ${modes?`<div class="grp">모드</div>${modes}`:''}`,
  box=>{
    box.querySelector('[data-new]').onclick=()=>{
      closeSheet();
      list.push({id:uid(),minutes:state.settings.defaultMinutes,taskIds:[],done:false});
      save(); onChange();
      setTimeout(()=>openBlockEditor(list,list.length-1,onChange),260);
    };
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
      const m=state.modes.find(x=>x.id===b.dataset.m);
      m.blocks.forEach(x=>list.push({id:uid(),minutes:x.minutes,taskIds:[...(x.taskIds||[])],done:false}));
      save(); haptic(9); closeSheet(); onChange();
    });
  });
}

/* ═══════════════════════════════════════════════════
   9. 블록 편집 — 시간과 할 일만
   ═══════════════════════════════════════════════════ */
function openBlockEditor(list,idx,onChange){
  const b=list[idx];
  let picked=[...(b.taskIds||[])];
  const rows=state.tasks.length
    ? state.tasks.map(t=>`<button class="row${picked.includes(t.id)?' sel':''}" data-t="${t.id}">
        <span class="box">${CHECK}</span><span class="nm">${esc(t.name)}</span></button>`).join('')
    : `<div class="none">설정에서 할 일을 먼저 만들어주세요</div>`;

  openSheet(`
    <h3>블록 편집</h3>
    <div class="field"><label>할 일 · 여러 개 고를 수 있어요</label><div class="picker">${rows}</div></div>
    <div class="field"><label>시간 (분)</label><input type="number" id="e-min" min="1" max="600" value="${b.minutes}"></div>
    <div class="actions">
      <button class="btn danger" id="e-del">삭제</button>
      <button class="btn primary" id="e-ok">저장</button>
    </div>`,
  box=>{
    box.querySelectorAll('[data-t]').forEach(r=>r.onclick=()=>{
      const id=r.dataset.t;
      if(picked.includes(id)){ picked=picked.filter(x=>x!==id); r.classList.remove('sel'); }
      else { picked.push(id); r.classList.add('sel'); haptic(5); }
    });
    box.querySelector('#e-ok').onclick=()=>{
      b.minutes=Math.max(1,parseInt(box.querySelector('#e-min').value)||state.settings.defaultMinutes);
      b.taskIds=picked; save(); closeSheet(); onChange();
    };
    box.querySelector('#e-del').onclick=()=>{ list.splice(idx,1); save(); closeSheet(); onChange(); };
  });
}

/* ═══════════════════════════════════════════════════
   10. 달력 — 블록이 하나라도 있었던 날만 점을 찍습니다
   ═══════════════════════════════════════════════════ */
let calY,calM;
{ const t=new Date(); calY=t.getFullYear(); calM=t.getMonth(); }
$('#c-prev').onclick=()=>{ calM--; if(calM<0){calM=11;calY--} renderCal(); };
$('#c-next').onclick=()=>{ calM++; if(calM>11){calM=0;calY++} renderCal(); };

function renderCal(){
  $('#c-month').textContent=`${calY}년 ${calM+1}월`;
  const wds=state.settings.weekStart==='sun'?WD_SUN:WD_MON;
  $('#c-wd').innerHTML=wds.map(w=>`<span>${w}</span>`).join('');

  const first=new Date(calY,calM,1).getDay();
  const offset=state.settings.weekStart==='sun'?first:(first+6)%7;
  const days=new Date(calY,calM+1,0).getDate();
  const tk=todayKey();
  let html='';
  for(let i=0;i<offset;i++) html+=`<div class="cell pad">0</div>`;
  for(let d=1;d<=days;d++){
    const k=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=!!(state.days[k] && state.days[k].blocks.length);
    html+=`<button class="cell${has?' has':''}${k===tk?' today':''}" data-k="${k}"><span>${d}</span><span class="dot"></span></button>`;
  }
  const g=$('#c-grid'); g.innerHTML=html;
  g.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>openDay(c.dataset.k));
}

let dayKey=null;
function openDay(k){
  dayKey=k;
  if(!state.days[k]) state.days[k]={blocks:[]};
  $('#d-date').textContent=label(k);
  renderDay(); show('v-day');
}
function renderDay(){
  renderBlocks($('#d-blocks'), state.days[dayKey].blocks,
    {toggle:true,timer:false,emptyText:'이 날은 기록이 없어요.'}, renderDay);
}
$('#d-add').onclick=()=>addSheet(state.days[dayKey].blocks,renderDay);

/* ═══════════════════════════════════════════════════
   11. 설정
   ═══════════════════════════════════════════════════ */
function renderSettings(){
  const s=state.settings;
  const hours=Array.from({length:24},(_,h)=>`<option value="${h}"${s.resetHour===h?' selected':''}>${h}시</option>`).join('');

  $('#s-body').innerHTML=`
    <div style="height:10px"></div>

/* 색 고르기 */
function openColorSheet(taskId){
  const t=task(taskId); if(!t) return;
  openSheet(`
    <h3>색 고르기</h3>
    <div class="swatches">
      ${PALETTE.map(p=>`<button class="swatch${t.color===p.c?' sel':''}" data-c="${p.c}" style="background:${p.c}" aria-label="${p.n}">${CHECK}</button>`).join('')}
    </div>`,
  box=>{
    box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
      t.color=b.dataset.c; save(); haptic(6);
      box.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
      b.classList.add('sel');
      setTimeout(()=>{ closeSheet(); renderSettings(); },210);
    });
  });
}

/* 모드 편집 */
let modeId=null;
function openMode(id){
  modeId=id;
  $('#m-name').value=state.modes.find(x=>x.id===id).name;
  renderModeBlocks(); show('v-mode');
}
function renderModeBlocks(){
  const m=state.modes.find(x=>x.id===modeId);
  renderBlocks($('#m-blocks'), m.blocks, {toggle:false,timer:false,emptyText:'이 모드에 담을 블록을 추가해주세요.'}, renderModeBlocks);
}
function saveModeEdit(){
  const m=state.modes.find(x=>x.id===modeId); if(!m) return;
  m.name=$('#m-name').value.trim()||'새 모드'; save();
}
$('#m-add').onclick=()=>{
  const m=state.modes.find(x=>x.id===modeId);
  m.blocks.push({id:uid(),minutes:state.settings.defaultMinutes,taskIds:[]});
  save(); renderModeBlocks();
  openBlockEditor(m.blocks,m.blocks.length-1,renderModeBlocks);
};
$('#m-del').onclick=()=>{
  state.modes=state.modes.filter(x=>x.id!==modeId); save();
  renderSettings(); show('v-set');
};

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='lowpowermood-backup.json'; a.click();
  toast('백업 파일을 내려받았어요');
}

/* ═══════════════════════════════════════════════════
   12. 시트 — 아래로 끌어 내릴 수 있고, 놓은 속도로
        마저 내려가거나 제자리로 돌아옵니다
   ═══════════════════════════════════════════════════ */
const sheet=$('#sheet'), veil=$('#veil');
let sy=null, sheetH=0;

function sheetSpring(){
  if(sy) return sy;
  sy=spring({from:1, response:.34, damping:1, eps:.0015, onUpdate:v=>{
    sheet.style.transform=`translate(-50%,${v*100}%)`;
    veil.style.opacity=String(Math.max(0,1-v));
  }, onRest:()=>{
    if(sy.x>=.999){ sheet.classList.remove('on'); veil.classList.remove('on'); }
  }});
  return sy;
}
function openSheet(html,init){
  sheet.innerHTML=`<div class="grabzone"><div class="grab"></div></div>${html}`;
  sheet.classList.add('on'); veil.classList.add('on');
  init&&init(sheet);
  const s=sheetSpring(); s.set(1); s.to(0);
  attachSheetDrag();
}
function closeSheet(){ sheetSpring().to(1); }
veil.onclick=closeSheet;

function attachSheetDrag(){
  const zone=sheet.querySelector('.grabzone');
  let dragging=false, y0=0, base=0, hist=[];

  const down=y=>{
    sheetH=sheet.getBoundingClientRect().height;
    const s=sheetSpring(); s.stop();
    dragging=true; y0=y; base=s.x; hist=[];
  };
  const move=(y,e)=>{
    if(!dragging) return;
    e&&e.preventDefault();
    hist.push({y,t:performance.now()}); if(hist.length>6) hist.shift();
    let d=(y-y0)/sheetH + base;
    if(d<0) d=rubber(d*sheetH,sheetH)/sheetH;     /* 위로는 점점 무겁게 */
    sheetSpring().set(d);
  };
  const up=()=>{
    if(!dragging) return; dragging=false;
    let v=0;
    if(hist.length>1){
      const a=hist[0], b=hist[hist.length-1];
      v=(b.y-a.y)/Math.max((b.t-a.t)/1000,.001);
    }
    const s=sheetSpring();
    const projected=s.x + project(v)/sheetH;      /* 이 속도면 어디에 멈출까 */
    s.to(projected>0.42 ? 1 : 0, v/sheetH);
  };

  zone.addEventListener('touchstart',e=>down(e.touches[0].clientY),{passive:true});
  zone.addEventListener('touchmove',e=>move(e.touches[0].clientY,e),{passive:false});
  zone.addEventListener('touchend',up);
  zone.addEventListener('mousedown',e=>{
    down(e.clientY);
    const mm=ev=>move(ev.clientY,ev), mu=()=>{ up(); window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
  });
}

/* ═══════════════════════════════════════════════════
   13. 알림
   ═══════════════════════════════════════════════════ */
let tt;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2300);
}
